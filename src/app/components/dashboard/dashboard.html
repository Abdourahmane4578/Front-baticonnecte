<!-- ===================================================
  Template : Dashboard
  Affiche un résumé de l'activité de l'utilisateur :
  - En-tête avec boutons d'action rapide
  - Grille de statistiques (demandes, dépenses, favoris)
  - Tableau des projets récents avec badge de statut coloré
=================================================== -->
<div class="page">

  <!-- En-tête -->
  <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-10 gap-5">
    <div>
      <span class="eyebrow mb-3">Tableau de bord</span>
      <h1 class="page-title">Bienvenue, Diallo 👋</h1>
      <p class="page-subtitle">Voici l'aperçu de vos projets et activités en cours.</p>
    </div>
    <div class="flex gap-2">
      <button class="btn btn-outline rounded-full">
        <lucide-icon name="download" class="w-4 h-4"></lucide-icon>
        Exporter
      </button>
      <button class="btn btn-primary rounded-full">
        <lucide-icon name="plus" class="w-4 h-4"></lucide-icon>
        Nouveau projet
      </button>
    </div>
  </div>

  <!-- KPI -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">

    <div class="card-bc card-bc-hover p-6 group">
      <div class="flex justify-between items-start mb-5">
        <span class="icon-box"><lucide-icon name="rocket"></lucide-icon></span>
        <span class="chip chip-success"><lucide-icon name="trending-up" class="w-3 h-3"></lucide-icon>+12 %</span>
      </div>
      <p class="text-xs font-semibold uppercase tracking-wider text-base-content/55 mb-1">Demandes actives</p>
      <p class="font-display text-4xl font-extrabold tracking-tight text-base-content">02</p>
    </div>

    <div class="card-bc card-bc-hover p-6 group">
      <div class="flex justify-between items-start mb-5">
        <span class="icon-box icon-box-accent"><lucide-icon name="coins"></lucide-icon></span>
        <span class="chip">Total</span>
      </div>
      <p class="text-xs font-semibold uppercase tracking-wider text-base-content/55 mb-1">Dépenses totales</p>
      <p class="font-display text-4xl font-extrabold tracking-tight text-base-content">90k <span class="text-lg text-base-content/45 font-bold">GNF</span></p>
    </div>

    <div class="card-bc card-bc-hover p-6 group">
      <div class="flex justify-between items-start mb-5">
        <span class="icon-box icon-box-success"><lucide-icon name="star"></lucide-icon></span>
        <span class="chip chip-primary">Top</span>
      </div>
      <p class="text-xs font-semibold uppercase tracking-wider text-base-content/55 mb-1">Artisans favoris</p>
      <p class="font-display text-4xl font-extrabold tracking-tight text-base-content">05</p>
    </div>
  </div>

  <!-- Projets récents -->
  <div class="card-bc overflow-hidden">
    <div class="px-6 py-5 border-b border-base-300/70 flex justify-between items-center">
      <h3 class="text-lg font-bold text-base-content">Projets récents</h3>
      <button class="link-bc text-sm inline-flex items-center gap-1">
        Voir tout
        <lucide-icon name="arrow-right" class="w-4 h-4"></lucide-icon>
      </button>
    </div>
    <div class="overflow-x-auto">
      <table class="table table-bc w-full">
        <thead>
          <tr>
            <th class="pl-6">Artisan</th>
            <th>Service</th>
            <th>Statut</th>
            <th class="text-right pr-6">Prix</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of projets" class="hover:bg-base-200/60 transition-colors">
            <td class="pl-6 py-4">
              <div class="flex items-center gap-3">
                <div class="avatar-bc w-10 h-10 rounded-xl font-bold text-xs">
                  {{p.artisan[0]}}
                </div>
                <span class="font-semibold text-base-content">{{p.artisan}}</span>
              </div>
            </td>
            <td class="text-base-content/65">{{p.service}}</td>
            <td>
              <span class="chip" [ngClass]="getStatusClass(p.status)">
                {{p.status}}
              </span>
            </td>
            <td class="text-right pr-6 font-bold text-base-content">{{p.price}}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
