<div class="page page-narrow">
  <a routerLink="/annonces" class="btn btn-ghost btn-sm rounded-full mb-5 -ml-2">
    <lucide-icon name="arrow-left" class="w-4 h-4"></lucide-icon>
    Retour aux annonces
  </a>

  <div *ngIf="loading" class="card-bc p-10 text-center text-base-content/60">
    <span class="loading loading-spinner loading-md text-primary"></span>
    <p class="mt-3 text-sm">Chargement de l'annonce…</p>
  </div>

  <div *ngIf="!loading && errorMessage" class="card-bc border-error/30 p-8 text-center">
    <span class="icon-box bg-error/10 text-error mx-auto mb-3"><lucide-icon name="triangle-alert"></lucide-icon></span>
    <p class="text-sm font-medium text-error">{{ errorMessage }}</p>
  </div>

  <article *ngIf="!loading && post" class="card-bc overflow-hidden animate-fade-up">
    <div *ngIf="getImageUrl(post.imageUrl || post.image) as imageUrl" class="w-full bg-base-200">
      <img [src]="imageUrl" alt="Image de l'annonce" loading="lazy" class="w-full h-80 object-cover">
    </div>

    <div class="p-6 md:p-8">
      <div class="flex items-start justify-between gap-4 mb-6 flex-wrap">
        <div>
          <span class="eyebrow mb-3">Annonce</span>
          <h1 class="page-title">{{ post.titre }}</h1>
          <p class="text-sm text-base-content/60 mt-2" *ngIf="post.fullName">
            Publié par <a [routerLink]="['/profil', post.userId]" class="link-bc">{{ post.fullName }}</a>
            <span *ngIf="post.date"> · {{ post.date }}</span>
          </p>
        </div>
      </div>

      <div>
        <h2 class="text-lg font-bold text-base-content mb-2">Description</h2>
        <p class="text-base-content/80 leading-7 whitespace-pre-wrap">{{ post.description || 'Aucune description disponible.' }}</p>
      </div>

      <div class="mt-8 pt-6 border-t border-base-300/70 flex gap-2 flex-wrap">
        <button routerLink="/messages" [queryParams]="post?.userId ? { with: post.userId } : {}" class="btn btn-primary rounded-full px-6">
          <lucide-icon name="message-circle" class="w-4 h-4"></lucide-icon>
          Contacter
        </button>
        <button routerLink="/annonces" class="btn btn-outline rounded-full px-6">
          Voir d'autres annonces
        </button>
      </div>
    </div>
  </article>
</div>
